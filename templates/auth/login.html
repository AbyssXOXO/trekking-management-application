<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Trek Flow</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' height='34px' viewBox='0 -960 960 960' width='34px' fill='%234a7c59'%3E%3Cpath d='M450-80q-33 0-66.5-7.5T315-109q12-121 70-226t149-185q-110 56-190.5 148T231-162q-4-3-7.5-6.5L216-176q-47-47-71.5-105T120-402q0-68 27-130t75-110q81-81 210-105.5t362-4.5q18 239-6 364.5T684-182q-49 49-109.5 75.5T450-80Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../static/css/auth.css">
</head>
<body>
  <header>
    <nav class="navbar custom-header-footer py-1">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#4a7c59"><path d="M450-80q-33 0-66.5-7.5T315-109q12-121 70-226t149-185q-110 56-190.5 148T231-162q-4-3-7.5-6.5L216-176q-47-47-71.5-105T120-402q0-68 27-130t75-110q81-81 210-105.5t362-4.5q18 239-6 364.5T684-182q-49 49-109.5 75.5T450-80Z"/></svg>
          Trek Flow
        </a>
      </div>
    </nav>
  </header>
  <main class="d-flex justify-content-center align-items-center gradient-login w-100">
    <div class="container">
      <div class="card rounded-4 shadow-lg login-card mx-auto" style="border: none;">
        <div class="card-body px-4 pt-4 pb-3">
          <h5 class="card-title text-center card-heading">Welcome Back</h5>
          <div class="nunito-sans-box">
            <p class="card-text text-center">Enter your details to access your Trek Flow account.</p>
            <form>
              <div class="mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="22" height="22" fill="#4a4e4a">
                  <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-32q0-34 17.5-62.5T226-298q62-31 126-46.5T480-360q64 0 128 15.5T734-298q31 15 48.5 43.5T800-192v32H160Zm60-60h520v-12q0-13-7.5-24.5T712-274q-51-26-109-39t-123-13q-65 0-123 13t-109 29q-13 7-20.5 18.5T160-242v12Zm260-320q42 0 71-29t29-71q0-42-29-71t-71-29q-42 0-71 29t-29 71q0 42 29 71t71 29Zm0-100Zm0 420Z"/>
                </svg>
                <label for="Username" class="form-label">Username</label>
                <input type="text" class="form-control input-box rounded-4" id="Username" placeholder="abc123">
              </div>
              <div class="mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="22" height="22" fill="#4a4e4a">
                  <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0-33-23.5 56.5T800-160H160Zm320-280L160-665v425h640v-425L480-440Zm0-80 318-200H162l318 200ZM160-665v-55 480-425Z"/>
                </svg>
                <label for="Email" class="form-label">Email Address</label>
                <input type="email" class="form-control input-box rounded-4" id="Email-tab" placeholder="you@example.com">
              </div>
              <div class="d-flex justify-content-between mb-1-5">
                <div class="d-flex gap-1">
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#4a4e4a">
                    <path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-6 7.73V17a1 1 0 1 0 2 0v-1.27a2 2 0 1 0-2 0zM10 8V6a2 2 0 1 1 4 0v2h-4z"/>
                  </svg>
                  <label for="password-form" class="form-label mb-0">Password</label>
                </div>
                <a href="#" class="forgot-link" style="text-decoration: none; color: rgb(112, 183, 41); font-weight: 500;">
                  Forgot Password?
                </a>
              </div>
              <div>
                <input type="password" class="form-control mb-0 input-box rounded-4" id="password-form" placeholder="••••••••">
              </div>
              <div class="text-center mt-4">
                <button type="submit" class="btn submit-button w-100 rounded-4">Log In →</button>
              </div>
            </form>
            <div>
              <hr>
              <div class="container d-flex justify-content-center gap-1">
                <p>New to Trek Flow?</p>
                <a href="{{ url_for('register') }}" class="new-account-link">Create new account</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="text-center py-2 custom-header-footer" style="color: #4a4e4a;">
    <p class="mb-0">&copy; 2026 Trek Flow. All rights reserved.</p>
  </footer>
</body>
</html>
